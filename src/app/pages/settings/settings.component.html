<section class="settings">
  <h1 class="settings__title">User Settings</h1>

  <div class="settings__section">
    <h2 class="settings__section-title">Posts Display</h2>

    <div class="settings__item">
      <label class="settings__label" for="postsLimit">Posts per page:</label>
      <select
        id="postsLimit"
        [value]="postsStore.limit()"
        (change)="onLimitChange($event)"
        class="settings__select"
      >
        <option value="3">3</option>
        <option value="5">5</option>
        <option value="10">10</option>
        <option value="20">20</option>
        <option value="50">50</option>
      </select>
    </div>

    <p class="settings__info">
      Currently showing <strong class="settings__limit">{{ postsStore.limit() }}</strong> posts per page.
    </p>
  </div>
</section>
