<nav class="panel">
  <ul class="panel__list">
    <li class="panel__item">
      <a
        id="nav-home"
        class="panel__link"
        routerLink="/"
        routerLinkActive="panel__link--active"
        [routerLinkActiveOptions]="{ exact: true }"
        >Home</a
      >
    </li>
    <li class="panel__item">
      <a
        id="nav-posts"
        class="panel__link"
        routerLink="/posts"
        routerLinkActive="panel__link--active"
        [class.panel__link--disabled]="!isAuthenticated()"
        [attr.tabindex]="isAuthenticated() ? 0 : -1"
        [attr.aria-disabled]="!isAuthenticated()"
        >Posts</a
      >
    </li>
    <li class="panel__item">
      <a id="nav-about" class="panel__link" routerLink="/about" routerLinkActive="panel__link--active"
        >About</a
      >
    </li>
  </ul>
</nav>
